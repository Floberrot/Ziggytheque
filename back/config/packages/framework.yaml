# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # No external call may hang a request: BnF, Google Books, covers, prices,
    # Jikan… A client that needs more sets its own timeout per request.
    http_client:
        default_options:
            timeout: 6
            max_duration: 15

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
