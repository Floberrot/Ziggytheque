; Production PHP settings (server and worker images), on top of php.ini-production.

; The code never changes inside an image: compile it once, never re-check the files.
; (Symfony's PHP-file caches invalidate their own entries when they rewrite them.)
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Symfony resolves many file paths on every request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Above the worker's own --memory-limit=256M (worker-supervisor.sh): the consumer
; stops itself cleanly between two messages before PHP would kill it in one.
memory_limit = 512M

expose_php = Off
