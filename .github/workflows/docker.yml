name: Docker images

# The production images are otherwise built only by the deploy workflows: a broken
# nginx or PHP setting would first show in production. Builds both images and
# checks what they serve, whenever a PR touches how they are built.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Dockerfile
      - .dockerignore
      - back/docker/**
      - back/Caddyfile
      - back/docker-entrypoint.sh
      - back/worker-supervisor.sh
      - back/composer.json
      - back/composer.lock
      - front/Dockerfile
      - front/nginx.conf.template
      - front/package.json
      - front/package-lock.json
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  backend:
    name: Backend image (FrankenPHP, production PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the prod stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: prod
          load: true
          tags: ziggy-back:ci
          cache-from: type=gha,scope=pr-back
          cache-to: type=gha,mode=max,scope=pr-back

      - name: Production PHP settings are loaded
        # Here-strings, not pipes: `grep -q` closing a pipe early fails the step under pipefail.
        run: |
          settings=$(docker run --rm --entrypoint php ziggy-back:ci -i)
          grep -E '^(opcache.validate_timestamps|opcache.memory_consumption|memory_limit|expose_php) ' <<< "$settings"
          grep -qE '^opcache.validate_timestamps => Off' <<< "$settings"
          grep -qE '^memory_limit => 512M' <<< "$settings"
          grep -qE '^expose_php => Off' <<< "$settings"

      - name: No dev or test values and no SPA copy in the image
        run: docker run --rm --entrypoint sh ziggy-back:ci -c 'test ! -e .env.dev && test ! -e .env.test && test ! -e public/spa'

      - name: The server boots and answers
        run: |
          # Throwaway values: Caddy's Mercure hub refuses to start without its keys.
          docker run -d --name back -p 8080:8080 \
            -e PORT=8080 \
            -e APP_SECRET=ci-only-app-secret-not-used-anywhere-else \
            -e JWT_PASSPHRASE=ci-only-jwt-passphrase \
            -e MERCURE_PUBLISHER_JWT_KEY=ci-only-mercure-publisher-key-0000000000 \
            -e MERCURE_SUBSCRIBER_JWT_KEY=ci-only-mercure-subscriber-key-000000000 \
            ziggy-back:ci
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8080/health && break
            sleep 2
          done
          headers=$(curl -fsS -D - -o /dev/null http://localhost:8080/health)
          echo "$headers"
          # expose_php = Off: PHP no longer announces itself.
          if grep -qi '^x-powered-by:' <<< "$headers"; then
            echo "X-Powered-By is still sent"
            exit 1
          fi

      - name: The server runs without root
        run: |
          # The real uid of every process in the container (FrankenPHP, its PHP threads).
          uids=$(docker exec back sh -c 'grep -H "^Uid:" /proc/[0-9]*/status 2>/dev/null; true')
          echo "$uids"
          test -n "$uids"
          if grep -qE 'Uid:[[:space:]]+0[[:space:]]' <<< "$uids"; then
            echo "a process runs as root"
            exit 1
          fi
          # What the app and Caddy write at runtime stays writable: the entrypoint
          # generated the JWT keys and warmed the cache before the server started.
          docker exec back sh -c 'test -s config/jwt/private.pem && test -w var/cache/prod && test -w /data/caddy && test -w /config/caddy'

      - name: Without root, the server still binds port 80 (PORT unset)
        run: |
          docker run -d --name back-port-80 -p 8081:80 \
            -e APP_SECRET=ci-only-app-secret-not-used-anywhere-else \
            -e JWT_PASSPHRASE=ci-only-jwt-passphrase \
            -e MERCURE_PUBLISHER_JWT_KEY=ci-only-mercure-publisher-key-0000000000 \
            -e MERCURE_SUBSCRIBER_JWT_KEY=ci-only-mercure-subscriber-key-000000000 \
            ziggy-back:ci
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8081/health && break
            sleep 2
          done
          curl -fsS http://localhost:8081/health
          test "$(docker exec back-port-80 id -u)" != 0

      - name: Server logs
        if: always()
        run: |
          docker logs back 2>&1 | tail -80 || true
          docker logs back-port-80 2>&1 | tail -40 || true

      - name: Build the worker stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: worker
          load: true
          tags: ziggy-worker:ci
          cache-from: type=gha,scope=pr-back

      - name: The worker runs without root
        # Its entrypoint waits for a database; the check runs in the image instead.
        run: |
          docker run --rm --entrypoint sh ziggy-worker:ci -c 'id && test "$(id -u)" != 0 && test -w var/cache/prod && test -w config/jwt'

  frontend:
    name: Frontend image (nginx compression and caching)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: front
          file: front/Dockerfile
          load: true
          tags: ziggy-front:ci
          cache-from: type=gha,scope=pr-front
          cache-to: type=gha,mode=max,scope=pr-front

      - name: nginx serves the SPA compressed, with the right cache and security headers
        run: |
          expect() {
            if ! grep -qi "$2" <<< "$1"; then
              echo "expected: $2"
              exit 1
            fi
          }

          docker run -d --name front -p 8080:80 -e BACKEND_URL=http://backend.invalid:8080 ziggy-front:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

          index=$(curl -fsS -D - -o /dev/null http://localhost:8080/)
          echo "$index"
          expect "$index" '^cache-control: no-cache'
          expect "$index" '^x-content-type-options: nosniff'
          # Report-only Content Security Policy (front/nginx.conf.template).
          expect "$index" "^content-security-policy-report-only: default-src 'self'; script-src 'self';"
          expect "$index" "object-src 'none'"
          expect "$index" "frame-ancestors 'self'"

          # A deep link falls back to index.html, revalidated too.
          deep_link=$(curl -fsS -D - -o /dev/null http://localhost:8080/collection)
          expect "$deep_link" '^cache-control: no-cache'

          html=$(curl -fsS http://localhost:8080/)
          # script-src 'self' fits the build only while index.html has no inline script.
          if grep -qP '<script(?![^>]*\bsrc=)[^>]*>' <<< "$html"; then
            echo "index.html carries an inline script: the CSP's script-src 'self' would block it"
            exit 1
          fi
          bundle=$(grep -oE '/assets/[^"]+\.js' <<< "$html" | sed -n 1p)
          test -n "$bundle"
          asset=$(curl -fsS -D - -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8080$bundle")
          echo "$asset"
          expect "$asset" '^cache-control: public, max-age=31536000, immutable'
          expect "$asset" '^content-encoding: gzip'
          expect "$asset" '^x-content-type-options: nosniff'

          # A missing bundle is a 404, never index.html, and never cached.
          missing=$(curl -s -D - -o /dev/null http://localhost:8080/assets/missing-chunk.js)
          echo "$missing"
          expect "$missing" '^HTTP/[0-9.]* 404'
          if grep -qi '^cache-control:' <<< "$missing"; then
            echo "a 404 bundle must not carry Cache-Control"
            exit 1
          fi

      - name: nginx runs without root, on port 80
        run: |
          # The real uid of every process in the container (master and workers).
          uids=$(docker exec front sh -c 'grep -H "^Uid:" /proc/[0-9]*/status 2>/dev/null; true')
          echo "$uids"
          test -n "$uids"
          if grep -qE 'Uid:[[:space:]]+0[[:space:]]' <<< "$uids"; then
            echo "a process runs as root"
            exit 1
          fi
          # The unprivileged user rendered the config from its template at start.
          docker exec front grep -q 'backend.invalid' /etc/nginx/conf.d/default.conf

      - name: nginx logs
        if: always()
        run: docker logs front 2>&1 | tail -40 || true
